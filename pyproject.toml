[project]
name = "traitement-chris"
version = "0.1.0"
description = "Parsing et traitement de données de caisse"
readme = "README.md"
authors = [
    { name = "Christophe Donnat", email = "christophe@donnat.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "reportlab>=4.4.3",
]

[project.scripts]
traitement = "traitement:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["traitement"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
